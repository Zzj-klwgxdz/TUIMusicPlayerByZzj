[package]
name = "music-player"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
dirs = "6.0.0"
futures = "0.3.34"
ratatui = "0.30.2"
crossterm = { version = "0.28.0", features = ["event-stream"] }
rfd = "0.17.2"
rodio = "0.22.2"
serde = {version="1.0.229",features=["derive"]}
tokio = {version="1.53.1",features=["fs", "macros", "rt-multi-thread"]}
tokio-util = "0.7.19"
walkdir = "2.5.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "derive"] }
lofty = "0.25.1"
tracing = "0.1.44"
tracing-subscriber={version="0.3",features=["env-filter"]}
tracing-appender = "0.2.5"
rand = "0.10.2"
rustfft = "6.2"
unicode-width = "0.2"
encoding_rs = "0.8"
rayon = "1.12.0"



